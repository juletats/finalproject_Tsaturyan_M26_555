[project]
name = "currency-wallet"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговыми валютами"
readme = "README.md"
authors = [
    { name = "Juliet Tsaturyan", email = "juleta-tsaturyan@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
wallet = "currency_wallet.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
