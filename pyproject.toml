[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами: пользователи, портфели, сделки и курсы"
readme = "README.md"
authors = [
    { name = "Juliet Tsaturyan", email = "juleta-tsaturyan@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "valutatrade_hub"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.valutatrade]
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
exchange_rates_file = "exchange_rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
min_password_length = 4
log_dir = "logs"
log_file = "actions.log"
parser_log_file = "parser.log"
log_level = "INFO"
log_format = "text"
log_max_bytes = 1000000
log_backup_count = 3
parser_request_timeout = 10
parser_update_interval_seconds = 900
parser_history_limit = 5000
